  <text x="98" y="435" fill="#a9b8d7" font-family="Arial,Helvetica,sans-serif" font-size="24">Partagez. Connectez. Construisez.</text><rect x="95" y="494" width="205" height="4" rx="2" fill="url(#glow)"/><text x="95" y="548" fill="#7f91b7" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2">AVANI-PRO.ONRENDER.COM</text>
