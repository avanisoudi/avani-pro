<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Avani Pro — Le réseau des professionnels qui construisent demain</title>
  <desc id="desc">Un espace social professionnel pour partager des idées, créer des communautés et faire avancer les projets.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b18"/><stop offset=".52" stop-color="#121338"/><stop offset="1" stop-color="#071d36"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#4f46e5"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="50"/></filter></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><circle cx="1010" cy="80" r="210" fill="#4f46e5" opacity=".2" filter="url(#blur)"/><circle cx="150" cy="560" r="200" fill="#06b6d4" opacity=".12" filter="url(#blur)"/>
  <g transform="translate(92 90)"><rect width="84" height="84" rx="24" fill="url(#glow)"/><path d="M27 59 42 25c2-4 7-4 9 0l16 34H55l-4-9H39l-4 9H27Zm16-19h5l-2.5-7L43 40Z" fill="white"/><circle cx="69" cy="26" r="5" fill="#67e8f9"/></g>
