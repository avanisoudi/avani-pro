services:
  - type: web
    name: avani-pro
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /confidentialite
        destination: /confidentialite/index.html
      - type: rewrite
        source: /confidentialite/
        destination: /confidentialite/index.html
      - type: rewrite
        source: /*
        destination: /index.html
